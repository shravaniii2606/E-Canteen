<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard</title>

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/student.css">
</head>
<body>

<div class="dashboard">

    <!-- Header -->
    <div class="header">
        <h2>Hello, Student 👋</h2>
        <p class="balance">₹250</p>
    </div>

    <!-- Search -->
    <div class="search-wrapper">
    <span class="search-icon">🔍</span>
    <input type="text" class="search-box" placeholder="Search items">
</div>

    <!-- Categories -->
    <div class="categories">
        <button class="active">Breakfast</button>
        <button>Lunch</button>
        <button>Snack</button>
    </div>

    <!-- Food Items -->
    <div class="food-grid">

        <div class="food-card">
            <h4>Onion Paratha</h4>
            <p>₹20</p>
            <button class="add-btn">Add</button>
        </div>

        <div class="food-card">
            <h4>Bread Omelette</h4>
            <p>₹45</p>
            <button class="add-btn">Add</button>
        </div>

        <div class="food-card">
            <h4>Chole Bhature</h4>
            <p>₹35</p>
            <button class="add-btn">Add</button>
        </div>

        <div class="food-card">
            <h4>Tea</h4>
            <p>₹12</p>
            <button class="add-btn">Add</button>
        </div>

    </div>

</div>
<!-- Bottom Navigation -->
<div class="bottom-nav">
    <div class="nav-item active">
        <span>🍽️</span>
        <p>Food</p>
    </div>

    <div class="nav-item">
        <span>🛒</span>
        <p>Cart</p>
    </div>

    <div class="nav-item">
        <span>📦</span>
        <p>Orders</p>
    </div>

    <div class="nav-item">
        <span>👤</span>
        <p>Profile</p>
    </div>
</div>

</body>
</html>
